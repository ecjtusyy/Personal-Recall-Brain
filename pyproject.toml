[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "personal-recall-brain"
version = "0.1.0"
description = "本地优先、证据可追溯的个人智能第二大脑"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "ecjtusyy"}]
dependencies = [
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "Pillow>=10,<13",
  "streamlit>=1.38,<2",
  "numpy>=1.26,<3",
  "rapidocr>=3.8,<4",
  "openvino>=2025.1,<2027",
  "openvino-genai>=2025.1,<2027",
  "openvino-tokenizers>=2025.1,<2027",
  "huggingface-hub>=0.30,<2",
  "av>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
conversion = [
  "optimum-intel[openvino]>=2.1,<3",
  "transformers>=5,<5.5",
  "nncf>=3.3,<4",
]

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

